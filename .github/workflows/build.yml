name: build-aab
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Kendi AdMob App ID'ni yaz (ca-app-pub-2288995098594728~XXXXXXXX). Şimdilik Google test ID.
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run prep
      - run: npx cap add android
      - name: Manifest + versiyon
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/></application>#" $M
          sed -i 's#<activity#<activity android:screenOrientation="landscape"#' $M
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: savas3d-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
